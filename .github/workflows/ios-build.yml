name: iOS build

concurrency:
  group: meanvc2-ios-build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ios-app-prototype]
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Resolve Swift package dependencies
        run: xcodebuild -resolvePackageDependencies -project ios/MeanVC2/MeanVC2.xcodeproj -scheme MeanVC2
      - name: Build iOS Simulator app
        run: |
          xcodebuild \
            -project ios/MeanVC2/MeanVC2.xcodeproj \
            -scheme MeanVC2 \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Run ONNX streaming inference smoke test in iPhone Simulator
        run: |
          set -euo pipefail
          UDID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); devices=[d for group in data["devices"].values() for d in group if d.get("isAvailable") and d["name"].startswith("iPhone")]; print(devices[0]["udid"] if devices else "")')"
          test -n "$UDID"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          APP_PATH="build/DerivedData/Build/Products/Debug-iphonesimulator/MeanVC2.app"
          test -d "$APP_PATH"
          xcrun simctl install "$UDID" "$APP_PATH"
          xcrun simctl launch "$UDID" jp.yanyantukebo.meanvc2
          DATA_PATH="$(xcrun simctl get_app_container "$UDID" jp.yanyantukebo.meanvc2 data)"
          for attempt in $(seq 1 180); do
            if [ -f "$DATA_PATH/Documents/onnx-pipeline-smoke-test.ok" ] && [ "$(cat "$DATA_PATH/Documents/onnx-pipeline-smoke-test.ok")" = "PASS" ]; then
              echo "ONNX streaming inference smoke test passed"
              exit 0
            fi
            sleep 1
          done
          xcrun simctl spawn "$UDID" log show --last 5m --style compact --predicate 'subsystem == "jp.yanyantukebo.meanvc2"' || true
          echo "ONNX pipeline smoke marker missing; app container: $DATA_PATH"
          exit 1
