name: iOS build

on:
  push:
    branches: [ios-app-prototype]
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Download validated Vocos Core ML package
        uses: actions/download-artifact@v4
        with:
          name: meanvc2-vocos-spectrogram-coreml
          repository: yanyantukebo1224/MeanVC2ForiOS
          run-id: 43672245973
          github-token: ${{ github.token }}
          path: ios/MeanVC2/Models
      - name: Verify Vocos package
        run: test -d ios/MeanVC2/Models/MeanVC2VocosSpectrogram.mlpackage
      - name: Build iOS Simulator app
        run: |
          xcodebuild \
            -project ios/MeanVC2/MeanVC2.xcodeproj \
            -scheme MeanVC2 \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
