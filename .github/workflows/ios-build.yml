name: iOS build

on:
  push:
    branches: [ios-app-prototype]
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Download latest validated Vocos Core ML package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_run=""
          while IFS= read -r run_id; do
            artifact_count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" --jq '[.artifacts[] | select(.name == "meanvc2-vocos-spectrogram-coreml" and .expired == false)] | length')"
            if [ "${artifact_count}" -gt 0 ]; then
              artifact_run="${run_id}"
              break
            fi
          run_ids="$(gh run list --workflow ios-model-convert.yml --branch ios-app-prototype --limit 50 --json databaseId --jq '.[].databaseId')"
          echo "Candidate model export runs:"
          printf '%s\\n' "${run_ids}"
          while IFS= read -r run_id; do
            [ -n "${run_id}" ] || continue
            artifact_count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" --jq '[.artifacts[] | select(.name == "meanvc2-vocos-spectrogram-coreml" and .expired == false)] | length')"
            if [ "${artifact_count}" -gt 0 ]; then
              artifact_run="${run_id}"
              break
            fi
          done <<< "${run_ids}"

          if [ -z "${artifact_run}" ]; then
            echo "No validated Vocos Core ML artifact was found."
            exit 1
          fi

          mkdir -p ios/MeanVC2/Models
          gh run download "${artifact_run}" --name meanvc2-vocos-spectrogram-coreml --dir ios/MeanVC2/Models
          test -d ios/MeanVC2/Models/MeanVC2VocosSpectrogram.mlpackage
      - name: Build iOS Simulator app
        run: |
          xcodebuild \
            -project ios/MeanVC2/MeanVC2.xcodeproj \
            -scheme MeanVC2 \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
