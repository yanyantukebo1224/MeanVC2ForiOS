name: iOS build

concurrency:
  group: meanvc2-ios-build-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [ios-app-prototype]
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Resolve Swift package dependencies
        run: xcodebuild -resolvePackageDependencies -project ios/MeanVC2/MeanVC2.xcodeproj -scheme MeanVC2
      - name: Build iOS Simulator app
        run: |
          xcodebuild \
            -project ios/MeanVC2/MeanVC2.xcodeproj \
            -scheme MeanVC2 \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Download and verify ONNX smoke-test models
        run: |
          set -euo pipefail
          mkdir -p build/MeanVC2Models
          base="https://huggingface.co/kiarina/MeanVC2-ONNX/resolve/2db97430c6e315a819daa30e255e14615205a3d1"
          curl -L --fail --retry 3 "$base/fbank.onnx?download=true" -o build/MeanVC2Models/fbank.onnx
          curl -L --fail --retry 3 "$base/asr.int8.onnx?download=true" -o build/MeanVC2Models/asr.int8.onnx
          curl -L --fail --retry 3 "$base/gtm.onnx?download=true" -o build/MeanVC2Models/gtm.onnx
          curl -L --fail --retry 3 "$base/dit.int8.onnx?download=true" -o build/MeanVC2Models/dit.int8.onnx
          curl -L --fail --retry 3 "$base/vocos.int8.onnx?download=true" -o build/MeanVC2Models/vocos.int8.onnx
          cd build/MeanVC2Models
          echo "ecbe193170abe98a8c0ba9299e8fe21b418145aca924e351c667b9257c3e28c8  fbank.onnx" | shasum -a 256 -c -
          echo "553869e3159af4497582072e66f09c16032a3b98ac2bad5c195b7443627616be  asr.int8.onnx" | shasum -a 256 -c -
          echo "f03ff1e9da3c373445f7518fa36fc99980fe4326447235fa89ea1923f57ee224  gtm.onnx" | shasum -a 256 -c -
          echo "52ac682ed1790b196333d1dbf99fa2806b6c52076c85e438c9dede968572675a  dit.int8.onnx" | shasum -a 256 -c -
          echo "a0dbd4c83708f6e787ceebf1c1b0833398dbdea6af770887d27b19119bba2e16  vocos.int8.onnx" | shasum -a 256 -c -
      - name: Run ONNX streaming inference smoke test in iPhone Simulator
        run: |
          set -euo pipefail
          UDID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); devices=[d for group in data["devices"].values() for d in group if d.get("isAvailable") and d["name"].startswith("iPhone")]; print(devices[0]["udid"] if devices else "")')"
          test -n "$UDID"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          APP_PATH="build/DerivedData/Build/Products/Debug-iphonesimulator/MeanVC2.app"
          test -d "$APP_PATH"
          xcrun simctl install "$UDID" "$APP_PATH"
          DATA_PATH="$(xcrun simctl get_app_container "$UDID" jp.yanyantukebo.meanvc2 data)"
          MODEL_PATH="$DATA_PATH/Library/Application Support/MeanVC2Models"
          mkdir -p "$MODEL_PATH"
          cp build/MeanVC2Models/*.onnx "$MODEL_PATH/"
          xcrun simctl launch "$UDID" jp.yanyantukebo.meanvc2
          SMOKE_OK=0
          for attempt in $(seq 1 180); do
            if [ -f "$DATA_PATH/Documents/onnx-pipeline-smoke-test.ok" ] && [ "$(cat "$DATA_PATH/Documents/onnx-pipeline-smoke-test.ok")" = "PASS" ]; then
              SMOKE_OK=1
              break
            fi
            sleep 1
          done
          if [ "$SMOKE_OK" != "1" ]; then
            xcrun simctl spawn "$UDID" log show --last 5m --style compact --predicate 'subsystem == "jp.yanyantukebo.meanvc2"' || true
            echo "ONNX pipeline smoke marker missing; app container: $DATA_PATH"
            exit 1
          fi
          test -f "$DATA_PATH/Documents/onnx-pipeline-smoke-output.f32"
          cp "$DATA_PATH/Documents/onnx-pipeline-smoke-output.f32" build/SwiftOutput.f32
      - name: Set up Python for ONNX parity
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install matching ONNX Runtime for reference parity
        run: python -m pip install "numpy<2" onnxruntime==1.24.2
      - name: Check Swift streaming output against Python reference
        run: |
          set -euo pipefail
          git clone https://github.com/kiarina/meanvc2_onnx.git /tmp/meanvc2-onnx
          git -C /tmp/meanvc2-onnx fetch --depth 1 origin 2285344b29d23a1a76d8032a12fe38f5dbe21de4
          git -C /tmp/meanvc2-onnx checkout --detach FETCH_HEAD
          python ios/tools/compare_onnx_reference.py \
            --model-dir build/MeanVC2Models \
            --reference-root /tmp/meanvc2-onnx \
            --swift-output build/SwiftOutput.f32
