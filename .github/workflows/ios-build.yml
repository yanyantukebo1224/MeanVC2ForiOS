name: iOS build

concurrency:
  group: meanvc2-ios-build-${{ github.ref }}
  # Do not cancel an active Simulator/model-validation run on a later push.
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    branches: [ios-app-prototype]
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      # This job only reads its own repository; do not persist its scoped token.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Check pinned ONNX Runtime dependency provenance
        run: python3 ios/tools/check_ort_dependency.py && python3 ios/tools/test_ort_dependency.py
      - name: Verify ONNX Runtime Objective-C source archive
        timeout-minutes: 10
        run: |
          set -euo pipefail
          mkdir -p build
          url="https://codeload.github.com/microsoft/onnxruntime/legacy.zip/3a728b75062256951b6e19ce718907cf1a1d4cf0"
          # The full commit SHA in this URL is the immutable source pin. Avoid
          # a separate api.github.com lookup: hosted runners can receive transient
          # API 403/rate-limit responses even when codeload is reachable.
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 15 --max-time 300 \
            --user-agent "MeanVC2-iOS-CI" "$url" -o build/onnxruntime-objc-source.zip
          unzip -tq build/onnxruntime-objc-source.zip
          echo "ONNX Runtime Objective-C source archive SHA256:"
          shasum -a 256 build/onnxruntime-objc-source.zip
          unzip -l build/onnxruntime-objc-source.zip | grep -E 'objectivec/include/onnxruntime.h$'
          unzip -l build/onnxruntime-objc-source.zip | grep -E '/LICENSE$'
      - name: Install CocoaPods dependencies
        timeout-minutes: 15
        run: |
          set -euo pipefail
          if ! command -v pod >/dev/null 2>&1; then
            sudo gem install cocoapods --no-document
          fi
          pod --version
          cd ios
          pod install
          grep -F "onnxruntime-c (1.24.3)" Podfile.lock
          grep -E "onnxruntime-objc(/Core)? \\(1\\.24\\.3\\)" Podfile.lock
      - name: Build iOS Simulator app
        timeout-minutes: 20
        run: |
          xcodebuild \
            -workspace ios/MeanVC2/MeanVC2.xcworkspace \
            -scheme MeanVC2 \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Test bounded audio queue policy
        run: |
          set -euo pipefail
          swiftc ios/MeanVC2/MeanVC2AudioFrameBudget.swift ios/tools/AudioFrameBudgetTests.swift -o build/AudioFrameBudgetTests
          build/AudioFrameBudgetTests
      - name: Test CI smoke diagnostics writer
        run: |
          set -euo pipefail
          swiftc ios/MeanVC2/MeanVC2SmokeDiagnostics.swift ios/tools/SmokeDiagnosticsTests.swift -o build/SmokeDiagnosticsTests
          build/SmokeDiagnosticsTests
      - name: Test deterministic non-degenerate Simulator fixture
        run: |
          set -euo pipefail
          mkdir -p build/MeanVC2CISmokeFixture
          swiftc ios/MeanVC2/MeanVC2CISmokeFixture.swift ios/tools/SmokeFixtureTests.swift -o build/SmokeFixtureTests
          build/SmokeFixtureTests build/MeanVC2CISmokeFixture
          python3 ios/tools/test_meanvc2_ci_fixture.py --swift-fixture-dir build/MeanVC2CISmokeFixture
      - name: Check Swift streaming profile against Python reference
        run: python3 ios/tools/check_stream_profile.py
      - name: Download and verify ONNX smoke-test models
        timeout-minutes: 12
        run: |
          set -euo pipefail
          mkdir -p build/MeanVC2Models
          base="https://huggingface.co/kiarina/MeanVC2-ONNX/resolve/2db97430c6e315a819daa30e255e14615205a3d1"
          curl --silent --show-error --location --fail --retry 3 --retry-all-errors --connect-timeout 15 --max-time 600 "$base/fbank.onnx?download=true" -o build/MeanVC2Models/fbank.onnx
          curl --silent --show-error --location --fail --retry 3 --retry-all-errors --connect-timeout 15 --max-time 600 "$base/asr.int8.onnx?download=true" -o build/MeanVC2Models/asr.int8.onnx
          curl --silent --show-error --location --fail --retry 3 --retry-all-errors --connect-timeout 15 --max-time 600 "$base/gtm.onnx?download=true" -o build/MeanVC2Models/gtm.onnx
          curl --silent --show-error --location --fail --retry 3 --retry-all-errors --connect-timeout 15 --max-time 600 "$base/dit.int8.onnx?download=true" -o build/MeanVC2Models/dit.int8.onnx
          curl --silent --show-error --location --fail --retry 3 --retry-all-errors --connect-timeout 15 --max-time 600 "$base/vocos.int8.onnx?download=true" -o build/MeanVC2Models/vocos.int8.onnx
      - name: Verify ONNX model manifest and downloaded assets
        run: python3 ios/tools/check_model_manifest.py --verify-files build/MeanVC2Models
      - name: Run ONNX streaming inference smoke test in iPhone Simulator
        timeout-minutes: 20
        run: |
          set -euo pipefail
          UDID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); devices=[d for group in data["devices"].values() for d in group if d.get("isAvailable") and d["name"].startswith("iPhone")]; print(devices[0]["udid"] if devices else "")')"
          test -n "$UDID"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          APP_PATH="build/DerivedData/Build/Products/Debug-iphonesimulator/MeanVC2.app"
          test -d "$APP_PATH"
          xcrun simctl install "$UDID" "$APP_PATH"
          DATA_PATH="$(xcrun simctl get_app_container "$UDID" jp.yanyantukebo.meanvc2 data)"
          MODEL_PATH="$DATA_PATH/Library/Application Support/MeanVC2Models"
          mkdir -p "$MODEL_PATH"
          cp build/MeanVC2Models/*.onnx "$MODEL_PATH/"
          STATUS_PATH="$DATA_PATH/Documents/onnx-pipeline-smoke-test.status"
          mkdir -p "$DATA_PATH/Documents"
          ACTIVATION_PATH="$DATA_PATH/Documents/meanvc2-ci-smoke.enable"
          rm -f "$STATUS_PATH" "$DATA_PATH/Documents/onnx-pipeline-smoke-test.ok" "$DATA_PATH/Documents/onnx-pipeline-smoke-output.f32" "$ACTIVATION_PATH"
          touch "$ACTIVATION_PATH"
          echo "Simulator app container: $DATA_PATH"
          SIMULATOR_CONSOLE_LOG="build/simulator-console.log"
          SIMCTL_LAUNCH_PID=""
          cleanup_simulator_console() {
            if [ -n "${SIMCTL_LAUNCH_PID:-}" ]; then
              kill "$SIMCTL_LAUNCH_PID" 2>/dev/null || true
              wait "$SIMCTL_LAUNCH_PID" 2>/dev/null || true
            fi
          }
          trap cleanup_simulator_console EXIT
          xcrun simctl launch --console --terminate-running-process "$UDID" jp.yanyantukebo.meanvc2 >"$SIMULATOR_CONSOLE_LOG" 2>&1 &
          SIMCTL_LAUNCH_PID=$!
          APP_INIT_SEEN=0
          for attempt in $(seq 1 30); do
            if [ -f "$STATUS_PATH" ]; then
              echo "ONNX pipeline smoke bootstrap: $(cat "$STATUS_PATH")"
              APP_INIT_SEEN=1
              break
            fi
            sleep 1
          done
          if [ "$APP_INIT_SEEN" != "1" ]; then
            echo "App did not create its smoke diagnostic status within 30 seconds."
            echo "--- simctl --console output ---"
            cat "$SIMULATOR_CONSOLE_LOG" || true
            echo "--- simulator unified log (app, dyld, bundle identifier) ---"
            xcrun simctl spawn "$UDID" log show --last 5m --style compact --predicate 'process == "MeanVC2" OR process == "dyld" OR eventMessage CONTAINS[c] "jp.yanyantukebo.meanvc2"' || true
            echo "--- app launch service state ---"
            xcrun simctl spawn "$UDID" launchctl list | grep -F "jp.yanyantukebo.meanvc2" || true
            exit 1
          fi
          SMOKE_OK=0
          LAST_STATUS=""
          for attempt in $(seq 1 600); do
            if [ -f "$STATUS_PATH" ]; then
              STATUS="$(cat "$STATUS_PATH")"
              if [ "$STATUS" != "$LAST_STATUS" ]; then
                echo "ONNX pipeline smoke status: $STATUS"
                LAST_STATUS="$STATUS"
              fi
              case "$STATUS" in
                PASS*) SMOKE_OK=1; break ;;
                FAIL*) break ;;
              esac
            fi
            sleep 1
          done
          if [ "$SMOKE_OK" != "1" ]; then
            echo "ONNX pipeline smoke test failed or timed out. Last status: ${LAST_STATUS:-<no status file>}"
            if [ -f "$STATUS_PATH" ]; then cat "$STATUS_PATH"; fi
            echo "--- simctl --console output ---"
            cat "$SIMULATOR_CONSOLE_LOG" || true
            xcrun simctl spawn "$UDID" log show --last 5m --style compact --predicate 'process == "MeanVC2" OR process == "dyld" OR eventMessage CONTAINS[c] "jp.yanyantukebo.meanvc2"' || true
            exit 1
          fi
          test -f "$DATA_PATH/Documents/onnx-pipeline-smoke-test.ok"
          test -f "$DATA_PATH/Documents/onnx-pipeline-smoke-output.f32"
          cp "$DATA_PATH/Documents/onnx-pipeline-smoke-output.f32" build/SwiftOutput.f32
          test ! -e "$ACTIVATION_PATH"
      - name: Set up Python for ONNX parity
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install matching ONNX Runtime for reference parity
        timeout-minutes: 10
        run: python -m pip install "numpy<2" onnxruntime==1.24.3
      - name: Check Swift streaming output against Python reference
        timeout-minutes: 15
        run: |
          set -euo pipefail
          git clone https://github.com/kiarina/meanvc2_onnx.git /tmp/meanvc2-onnx
          git -C /tmp/meanvc2-onnx fetch --depth 1 origin 2285344b29d23a1a76d8032a12fe38f5dbe21de4
          git -C /tmp/meanvc2-onnx checkout --detach FETCH_HEAD
          python ios/tools/compare_onnx_reference.py \
            --model-dir build/MeanVC2Models \
            --reference-root /tmp/meanvc2-onnx \
            --swift-output build/SwiftOutput.f32
