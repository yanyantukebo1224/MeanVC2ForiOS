name: iOS build

concurrency:
  group: meanvc2-ios-build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ios-app-prototype]
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Download validated Vocos Core ML package
        uses: actions/download-artifact@v4
        with:
          name: meanvc2-vocos-spectrogram-coreml
          repository: yanyantukebo1224/MeanVC2ForiOS
          run-id: 43672245973
          github-token: ${{ github.token }}
          path: ios/MeanVC2/Models
      - name: Normalize downloaded Core ML package layout
        run: |
          set -euo pipefail
          package="ios/MeanVC2/Models/MeanVC2VocosSpectrogram.mlpackage"
          if [ ! -d "$package" ] && [ -d ios/MeanVC2/Models/Data ] && [ -f ios/MeanVC2/Models/Manifest.json ]; then
            mkdir -p "$package"
            mv ios/MeanVC2/Models/Data "$package/"
            mv ios/MeanVC2/Models/Manifest.json "$package/"
          fi
          test -f "$package/Data/com.apple.CoreML/model.mlmodel"
          test -f "$package/Manifest.json"
      - name: Build iOS Simulator app
        run: |
          xcodebuild \
            -project ios/MeanVC2/MeanVC2.xcodeproj \
            -scheme MeanVC2 \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Run Vocos inference smoke test in iPhone Simulator
        run: |
          set -euo pipefail
          UDID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); devices=[d for group in data["devices"].values() for d in group if d.get("isAvailable") and d["name"].startswith("iPhone")]; print(devices[0]["udid"] if devices else "")')"
          test -n "$UDID"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          APP_PATH="build/DerivedData/Build/Products/Debug-iphonesimulator/MeanVC2.app"
          test -d "$APP_PATH"
          xcrun simctl install "$UDID" "$APP_PATH"
          xcrun simctl launch "$UDID" jp.yanyantukebo.meanvc2
          sleep 20
          xcrun simctl spawn "$UDID" log show --last 3m --style compact --predicate 'subsystem == "jp.yanyantukebo.meanvc2"' || true
          DATA_PATH="$(xcrun simctl get_app_container "$UDID" jp.yanyantukebo.meanvc2 data)"
          if [ ! -f "$DATA_PATH/Documents/vocos-smoke-test.ok" ]; then
            echo "Vocos smoke marker missing; app container: $DATA_PATH"
            xcrun simctl spawn "$UDID" launchctl list | grep -i meanvc2 || true
            exit 1
          fi
          test "$(cat "$DATA_PATH/Documents/vocos-smoke-test.ok")" = "PASS"
