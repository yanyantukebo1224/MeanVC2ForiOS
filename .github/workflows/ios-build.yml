name: iOS build

on:
  push:
    branches: [ios-app-prototype]
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Download validated Vocos Core ML package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p ios/MeanVC2/Models
          # This run produced the validated Vocos spectral package and passed
          # the PyTorch-vs-iSTFT numerical parity check.
          gh run download 43672245973 --name meanvc2-vocos-spectrogram-coreml --dir ios/MeanVC2/Models
          test -d ios/MeanVC2/Models/MeanVC2VocosSpectrogram.mlpackage
      - name: Build iOS Simulator app
        run: |
          xcodebuild \
            -project ios/MeanVC2/MeanVC2.xcodeproj \
            -scheme MeanVC2 \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
