name: MeanVC2 static validation

on:
  workflow_dispatch:
  push:
    branches: [ios-app-prototype]
    paths:
      - ".github/workflows/meanvc2-static-validation.yml"
      - "ios/**"
      - "runtime/**"
      - "src/config/config_120ms_40ms.json"
      - "THIRD_PARTY_NOTICES.md"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate pinned ONNX Runtime provenance
        run: |
          python3 ios/tools/check_ort_dependency.py
          python3 ios/tools/test_ort_dependency.py

      - name: Validate model asset manifest
        run: python3 ios/tools/check_model_manifest.py

      - name: Test streaming profile parser regression
        run: python3 ios/tools/test_stream_profile.py

      - name: Validate Swift/Python streaming profile parity
        run: python3 ios/tools/check_stream_profile.py

      - name: Compile Python validation tools
        run: python3 -m compileall -q ios/tools
