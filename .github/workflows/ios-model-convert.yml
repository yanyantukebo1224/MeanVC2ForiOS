name: iOS Core ML model export

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Model profile
        required: true
        type: choice
        options: [40ms_40ms]
        default: 40ms_40ms
  push:
    branches: [ios-app-prototype]
    paths:
      - "ios/tools/**"
      - ".github/workflows/ios-model-convert.yml"

permissions:
  contents: read

jobs:
  export-vocos:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ios-app-prototype
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install conversion dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==2.5.0" "torchaudio==2.5.0" "coremltools==8.3.0" "huggingface_hub" "safetensors" numpy
      - name: Download official Vocos checkpoint
        run: |
          python - <<'PY'
          from huggingface_hub import hf_hub_download
          from pathlib import Path
          import shutil
          target = Path("ckpts/vocos/vocos.pt")
          target.parent.mkdir(parents=True, exist_ok=True)
          src = hf_hub_download(repo_id="ASLP-lab/MeanVC2", filename="vocos.pt")
          shutil.copy2(src, target)
          print(f"vocos.pt: {target.stat().st_size} bytes")
          PY
      - name: Inspect Vocos TorchScript graph
        run: python ios/tools/inspect_vocos.py
      - name: Upload Vocos graph diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: meanvc2-vocos-graph-diagnostics
          path: ios/Diagnostics/vocos_torchscript_graph.txt
          if-no-files-found: error
          retention-days: 14
      - name: Export Vocos and compare outputs
        run: python ios/tools/export_coreml.py --skip-asr
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meanvc2-vocos-spectrogram-coreml
          path: ios/Models/MeanVC2VocosSpectrogram.mlpackage
          if-no-files-found: ignore
          retention-days: 14

  export-asr:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ios-app-prototype
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install conversion dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==2.5.0" "torchaudio==2.5.0" "coremltools==8.3.0" "huggingface_hub" "safetensors" numpy
      - name: Download official Fast-U2++ checkpoint
        run: |
          python - <<'PY'
          from huggingface_hub import hf_hub_download
          from pathlib import Path
          import shutil
          target = Path("preprocess/ckpts/fastu2pp_80ms.pt")
          target.parent.mkdir(parents=True, exist_ok=True)
          src = hf_hub_download(repo_id="ASLP-lab/MeanVC2", filename="fastu2pp_80ms.pt")
          shutil.copy2(src, target)
          print(f"fastu2pp_80ms.pt: {target.stat().st_size} bytes")
          PY
      - name: Inspect Fast-U2++ TorchScript graph
        run: python ios/tools/inspect_asr.py
      - name: Upload Fast-U2++ graph diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: meanvc2-fastu2pp-graph-diagnostics
          path: ios/Diagnostics/fastu2pp_torchscript_graph.txt
          if-no-files-found: error
          retention-days: 14
      - name: Export ASR and compare outputs
        run: python ios/tools/export_coreml.py --skip-vocoder
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meanvc2-asr-coreml
          path: ios/Models/MeanVC2ASR.mlpackage
          if-no-files-found: ignore
          retention-days: 14
